name: Build and deploy PHP site as static to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install dependencies (if any)
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --no-interaction --no-progress
          fi

      - name: Start PHP built-in server with router
        run: |
          php -S 127.0.0.1:8000 router.php > /dev/null 2>&1 &
          sleep 5

      - name: Install wget
        run: sudo apt-get update && sudo apt-get install -y wget

      - name: Crawl site to produce static files
        run: |
          rm -rf export || true
          mkdir export

          wget --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --span-hosts \
            --retry-connrefused \
            --tries=5 \
            --waitretry=2 \
            http://127.0.0.1:8000/ -P export || true

          if [ -d export/127.0.0.1:8000 ]; then 
            mv export/127.0.0.1:8000/* export/ || true
          fi

          find export -type d -empty -delete || true

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./export

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
