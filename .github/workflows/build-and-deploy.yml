name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies (if you have composer.json)
        run: composer install --no-dev --no-progress --no-suggest

      - name: Start PHP server
        run: |
          php -S 127.0.0.1:8000 &
          sleep 5 # Wait for server to start

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Build with Wget (with retry logic)
        run: |
          mkdir -p _site
          # Try wget with better error handling
          wget --recursive \
               --no-verbose \
               --convert-links \
               --page-requisites \
               --adjust-extension \
               --no-parent \
               --no-host-directories \
               --retry-connrefused \
               --tries=3 \
               --timeout=30 \
               http://127.0.0.1:8000 || echo "wget completed with warnings"
          
          # Move files to _site directory
          mv 127.0.0.1:8000/* _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
